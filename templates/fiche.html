<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{ livre.titre }}</title>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
        font-family: 'Segoe UI', sans-serif;
        background: linear-gradient(135deg, #1e3c72, #2a5298);
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        padding: 20px;
    }
    .fiche {
        background: white;
        border-radius: 18px;
        max-width: 420px;
        width: 100%;
        padding: 30px 26px;
        box-shadow: 0 10px 30px rgba(0,0,0,0.25);
        text-align: center;
    }
    .icone {
        font-size: 3rem;
        margin-bottom: 10px;
    }
    h1 { font-size: 1.4rem; color: #1e3c72; margin-bottom: 6px; }
    .auteur { color: #666; font-style: italic; margin-bottom: 18px; }
    .info-ligne {
        display: flex;
        justify-content: space-between;
        padding: 10px 0;
        border-bottom: 1px solid #eee;
        font-size: 0.9rem;
    }
    .info-ligne span:first-child { color: #888; }
    .info-ligne span:last-child { font-weight: 600; color: #222; }
    .statut {
        display: inline-block;
        margin-top: 18px;
        padding: 8px 22px;
        border-radius: 20px;
        font-weight: 700;
        font-size: 0.9rem;
    }
    .dispo { background: #d4f8e8; color: #0a7a4a; }
    .emprunte { background: #fde2e2; color: #b3261e; }
    .bouton-lien {
        display: inline-block;
        margin-top: 16px;
        background: #2a5298;
        color: white;
        padding: 10px 24px;
        border-radius: 20px;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
    }
    .retour {
        display: block;
        margin-top: 22px;
        color: #2a5298;
        text-decoration: none;
        font-weight: 600;
        font-size: 0.9rem;
    }
</style>
</head>
<body>
    <div class="fiche">
        <div class="icone">📖</div>
        <h1>{{ livre.titre }}</h1>
        <p class="auteur">{{ livre.auteur }}</p>

        <div class="info-ligne">
            <span>Catégorie</span>
            <span>{{ livre.categorie }}</span>
        </div>
        <div class="info-ligne">
            <span>ID exemplaire</span>
            <span>#{{ id_livre }}</span>
        </div>

        {% if livre.disponible %}
            <span class="statut dispo">✔ Disponible</span>
        {% else %}
            <span class="statut emprunte">✖ Emprunté</span>
        {% endif %}

        <br>
      <img src="{{ url_for('static', filename='qr_livre_' ~ id_livre ~ '.png') }}" alt="QR code" style="width:160px; height:160px; margin-top:16px;">
        <a href="{{ livre.lien }}" target="_blank" class="bouton-lien">📖 Lire en ligne</a>
        <a href="/" class="retour">← Retour au catalogue</a>
    </div>
</body>
</html>
